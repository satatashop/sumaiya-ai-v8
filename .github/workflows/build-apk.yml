
name: Build Sumaiya AI V8 APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm install

      - name: Prepare web files
        run: |
          mkdir -p www
          cp index.html www/index.html

      - name: Configure Capacitor
        run: |
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.sumaiya.aiassistant",
            "appName": "Sumaiya AI V8",
            "webDir": "www"
          }
          EOF

      - name: Add Android
        run: npx cap add android

      - name: Integrate AppList plugin
        run: |
          mkdir -p android/app/src/main/java/com/sumaiya/aiassistant
          cp native/AppListPlugin.java android/app/src/main/java/com/sumaiya/aiassistant/AppListPlugin.java

      - name: Add launcher visibility
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("android/app/src/main/AndroidManifest.xml")
          s = p.read_text()
          queries = '''
              <queries>
                  <intent>
                      <action android:name="android.intent.action.MAIN" />
                      <category android:name="android.intent.category.LAUNCHER" />
                  </intent>
              </queries>
          '''
          s = s.replace("<application", queries + "\n    <application", 1)
          p.write_text(s)
          PY

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Sumaiya-AI-V8-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
